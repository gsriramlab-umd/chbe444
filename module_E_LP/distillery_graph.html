<script src="https://www.desmos.com/api/v1.12/calculator.js?apiKey=a0c93851865c451b93bce0de92e0c3ab"></script>
<div id="calculator" style="width: 1000px; height: 600px;"></div>
<script>
var elt = document.getElementById('calculator');
var Calc = Desmos.GraphingCalculator(elt);

Calc.setExpression({latex:'x_1 = x', hidden:'true'})
Calc.setExpression({latex:'x_2 = y', hidden:'true'})
Calc.setExpression({latex:'0.05 x_1 + 0.10 x_2 <= 150', id:'f1', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'0.10 x_1 + 0.05 x_2 <= 150', id:'f2', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'0.05 x_1 + 0.15 x_2 <= 150', id:'f3', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'0.20 x_2 <= 150', id:'s4', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'x_1 >= 0', id:'x1', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'x_2 >= 0', id:'x2', color:'#ffbe98', fillOpacity:'0.1'})
Calc.setExpression({latex:'5 x_1 + 10 x_2 = z', id:'obj', color:'#000000', fillOpacity:'0.1'})
Calc.setExpression({latex:'\\operatorname{polygon}((0, 0), (1500, 0), (1200, 600), (750, 750), (0, 750))', id:'feasible', color:'#006167', fillOpacity:'0'})

Calc.setExpression({id:'z', latex:'z=0'})
Calc.setExpression({id:'z',sliderBounds:{min:'0', max:'15000', step:'1000'}})

Calc.setExpression({latex:'(1200,600)', color:'#000000', label:'optimum', showLabel:'True'})

Calc.setMathBounds({left:-100,right:2000,bottom:-100,top:2000})
Calc.updateSettings({showGrid:true,showXAxis:true,showYAxis:true,lockViewport:true,expressionsCollapsed:true})
</script>
